<div class="container mt-4">
  <h2 class="mb-4">Gestión de Solicitudes y Revisiones</h2>

  <!-- Botones para cambiar entre vistas o filtros -->
  <div class="filters mb-3">
    <button class="btn btn-secondary me-2" (click)="loadSolicitudes(undefined)">Todos</button>
    <button class="btn btn-warning me-2" (click)="loadSolicitudes(true)">Bloqueados</button>
    <button class="btn btn-info me-2 text-white" (click)="loadGamesNeedRevision()">Necesitan Revisión</button>
  </div>

  <!-- Tabla estructurada correctamente -->
  <div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>Nombre</th>
          <th>Estado Bloqueado</th>
          <th class="text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (game of games(); track game.externalId) {
          <tr>
            <td><strong>{{ game.name }}</strong></td>
            <td>
              <!-- Indicador visual del estado -->
              <span class="badge" [class.bg-danger]="game.statusBlocked" [class.bg-success]="!game.statusBlocked">
                {{ game.statusBlocked ? 'Bloqueado' : 'Activo' }}
              </span>
            </td>
            <td class="text-center">
              <!-- Si está bloqueado, botón para Aprobar/Desbloquear -->
              @if (game.statusBlocked) {
                <button class="btn btn-success btn-sm" (click)="authorizeGame(game.externalId)">
                  Aprobar / Desbloquear
                </button>
              } @else {
                <!-- Si está activo, botón para Desautorizar -->
                <button class="btn btn-danger btn-sm" (click)="desautorizedGame(game.externalId)">
                  Desautorizar
                </button>
              }
            </td>
          } @empty {
          <tr>
            <td colspan="3" class="text-center text-muted py-4">
              No hay juegos para mostrar.
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <!-- Paginación -->
  <app-pagination 
    [page]="page()" 
    [totalPages]="totalPages()" 
    (pageChange)="goToPage($event)" />
</div>
