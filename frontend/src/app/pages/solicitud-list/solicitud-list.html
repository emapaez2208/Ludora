<div class="container">
  <h2>Gestión de Solicitudes y Revisiones</h2>

  <!-- Botones para cambiar entre vistas o filtros -->
  <div class="filters mb-3">
    <button class="btn btn-secondary me-2" (click)="loadSolicitudes(undefined)">Todos</button>
    <button class="btn btn-warning me-2" (click)="loadSolicitudes(true)">Bloqueados</button>
    <button class="btn btn-info me-2 text-white" (click)="loadGamesNeedRevision()">Necesitan Revisión</button>
  </div>

  <table class="table">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Estado Bloqueado</th>
        <th>Acciones</th>
      </tr>
    </thead>
   <ul>

    @for (game of games(); track game.externalId) {

      <li><p>Nombre : {{game.name}} </p>
           <p>Estado : {{game.statusBlocked}}</p>
      <!-- Si está bloqueado, mostramos el botón para Autorizar/Desbloquear -->
      @if (game.statusBlocked) {
        <button class="btn btn-success" (click)="authorizeGame(game.externalId)">
          Aprobar / Desbloquear
        </button>
      } @else {
        <!-- Si está activo/aprobado, mostramos el botón para Desautorizar -->
        <button class="btn btn-danger" (click)="desautorizedGame(game.externalId)">
          Desautorizar
        </button>}
        </li>
      }
   </ul>
  </table>

  <app-pagination 
    [page]="page()" 
    [totalPages]="totalPages()" 
    (pageChange)="goToPage($event)" />
</div>
