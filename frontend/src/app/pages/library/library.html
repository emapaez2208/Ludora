<div class="container">

  <h2>Mi biblioteca</h2>

  <div class="filters-bar">

    <button class="btn btn-filters" (click)="toggleFilters()">
      Filtros {{ showFilters() ? '▲' : '▼' }}
    </button>

    @if (showFilters()) {
      <app-game-filter-panel
        [initial]="filters()"
        [libraryMode]="true"
        (apply)="onApply($event)"
      />
    }

  </div>

  @if (isLoading()) {

    <p>Cargando biblioteca...</p>

  } @else if (msjError()) {

    <p class="error-message">{{ msjError() }}</p>

  } @else {

    <div class="games-grid">

      @for (game of games(); track game.externalId) {

        <app-game-card [game]="game">
        </app-game-card>

      } @empty {

        <p class="empty-message">
          No se encontraron juegos en tu biblioteca.
        </p>

      }

    </div>

    @if (totalPages() > 1) {
      <app-pagination
        [page]="page()"
        [totalPages]="totalPages()"
        (pageChange)="goToPage($event)"
      />
    }

  }

</div>
