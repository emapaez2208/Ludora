<div class="container">
    <h2>Gestión de juegos</h2>

    <div class="tabs">
        <button class="tab tab-all" [class.active]="tab() === 'all'" (click)="selectTab('all')">
            Todos los juegos
        </button>

        <button class="tab tab-revision" [class.active]="tab() === 'needRevision'" (click)="selectTab('needRevision')">
            Necesitan revisión
        </button>

        <button class="tab tab-blocked" [class.active]="tab() === 'blocked'" (click)="selectTab('blocked')">
            Bloqueados
        </button>

    </div>

    <div class="filters-bar">

        <button class="btn btn-filters" (click)="toggleFilters()">
        Filtros {{ showFilters() ? '▲' : '▼' }}
        </button>

        <app-game-sort [sort]="sort()" (sortChange)="onSortChange($event)" />

    </div>

    @if (showFilters()) {
        <app-game-filter-panel [initial]="filters()" (apply)="onApply($event)" />
    }

    @if (isLoading()) {
        <p>Cargando juegos...</p>

    } @else if (errorMsg()) {
        <p>{{ errorMsg() }}</p>

    } @else {
        <div class="games-grid">

        @for (game of games(); track game.externalId) {
            <app-game-card [game]="game" [showStatus]="true" />

        } @empty {
            <p>No hay juegos en esta categoría.</p>
        }

        </div>
    }

    <app-pagination
        [page]="page()"
        [totalPages]="totalPages()"
        (pageChange)="goToPage($event)" />

</div>
