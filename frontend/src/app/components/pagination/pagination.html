@if (totalPages() > 1) {
      <div class="pagination-container">
        <button 
          class="page-btn" 
          (click)="prev()" 
          [disabled]="page() === 0">
          Anterior
        </button>

        <div class="pagination-numbers">
          @for (p of visiblePages(); track $index) {
            @if (p === '...') {
              <span class="pagination-ellipsis">...</span>
            } @else {
              <button 
                class="page-number-btn" 
                [class.active]="page() + 1 === p"
                (click)="goTo(p)">
                {{ p }}
              </button>
            }
          }
        </div>

        <button 
          class="page-btn" 
          (click)="next()" 
          [disabled]="page() >= totalPages() - 1">
          Siguiente
        </button>
      </div>
    }
