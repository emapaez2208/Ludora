<div class="game-card">
  <a [routerLink]="['/catalog', game().externalId]" class="game-image-container">
    <img [src]="game().frontPage" [alt]="game().name" class="game-cover" />
  </a>

  <div class="game-info">
    <h3>
      <a [routerLink]="['/catalog', game().externalId]" class="game-link">{{ game().name }}</a>
    </h3>
    <p class="price">${{ game().price }}</p>
    <p class="age">Edad: {{ game().ageRange }}</p>

    <div class="genres">
      @for (genre of game().genres; track genre) {
        <span class="badge">{{ genre }}</span>
      }
    </div>

    <div class="card-actions">
      <ng-content />   <!-- acá van los botones de cada pantalla -->
    </div>
  </div>
</div>
