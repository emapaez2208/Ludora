<div class="filters-panel">

  <label>
    Nombre
    
    <input
      type="text"
      placeholder="Buscar juego..."
      [value]="filters().name ?? ''"
      (input)="update('name', $any($event.target).value)"
      (keydown.enter)="submit()" />
  
</label>

  <label>
    Desarrolladora
    
    <select
      [value]="filters().developerCompany ?? ''"
      (change)="update('developerCompany', $any($event.target).value)">
      <option value="">Todas</option>
      @for (c of companies(); track c) {
        <option [value]="c">{{ c }}</option>
      }
    </select>

  </label>

  <label>
    Precio mínimo
    
    <input type="number" min="0" placeholder="0"
      [value]="filters().minPrice ?? ''"
      (input)="update('minPrice', $any($event.target).value)" />

  </label>

  <label>
    Precio máximo
    
    <input type="number" min="0" placeholder="Sin límite"
      [value]="filters().maxPrice ?? ''"
      (input)="update('maxPrice', $any($event.target).value)" />

  </label>


  @if (priceInvalid) {
    <p class="filter-error">El precio mínimo no puede ser mayor que el máximo.</p>
  }

  <label>
    Lanzado desde

    <input type="date" [max]="today"
      [value]="filters().minReleaseDate ?? ''"
      (input)="update('minReleaseDate', $any($event.target).value)" />

  </label>

  <label>
    Lanzado hasta

    <input type="date" [max]="today"
      [value]="filters().maxReleaseDate ?? ''"
      (input)="update('maxReleaseDate', $any($event.target).value)" />

  </label>

  @if (dateInvalid) {
    <p class="filter-error">La fecha inicial no puede ser posterior a la final.</p>
  }

  <label>
    Clasificación por edad

    <select
      [value]="filters().rangeName ?? ''"
      (change)="update('rangeName', $any($event.target).value)">

      <option value="">Todas</option>

      @for (range of ageRanges(); track range.externalId) {
        <option [value]="range.rangeName">{{ range.rangeName }} (+{{ range.minAge }})</option>
      }

    </select>

  </label>

  <fieldset class="genre-fieldset">
    <legend>Géneros</legend>

    <div class="genre-options">

      @for (genre of genres(); track genre.name) {
        <label class="check" [title]="genre.description">
          
          <input
            type="checkbox"
            [checked]="hasGenre(genre.name)"
            (change)="toggleGenre(genre.name)" />

          {{ genre.name }}
        </label>
      }
    </div>
  </fieldset>

  <div class="filter-actions">
    <button class="btn" (click)="submit()">Aplicar</button>
    <button class="btn btn-secondary" (click)="reset()">Limpiar</button>
  </div>
  
</div>
