<div class="sort">
  <button class="btn btn-sort" (click)="toggle()">
    Ordenar {{ open() ? '▲' : '▼' }}
  </button>

  @if (open()) {
    <ul class="sort-menu">
      @for (option of options; track option.label) {
        <li>
          <button
            class="sort-option"
            [class.active]="isActive(option.value)"
            (click)="select(option.value)">
            {{ option.label }}
          </button>
        </li>
      }
    </ul>
  }
</div>
